context: |
  Проект «Pendel» — прошивка для физического устройства на ESP32-C3
  (Arduino framework, arduino-cli, плата esp32:esp32:esp32c3).
  Аппаратура: OLED 128x128 по I2C,
  одна кнопка, светодиод, активный баззер, датчик AHT20+BMP280 по I2C.
  Питание от сети, постоянное подключение к Wi-Fi.
  Все артефакты (proposal, design, specs, tasks) пишутся на русском языке.
  Ограничения платформы: ограниченная RAM/flash ESP32-C3, неблокирующая
  логика в главном цикле (millis() вместо delay()), настройки хранятся
  в энергонезависимой памяти и редактируются через веб-админку.
  Канал команд от родителя ещё не выбран: пульт на ESP32-C3 или Telegram-бот.

